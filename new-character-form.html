<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Character</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS to ensure stacked label layout */
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            padding: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="details.html">Details</a>
        <a href="about.html">About</a>
        <a href="new-character-form.html">Add a Character</a>
    </nav>

    <header>
        <h1>Add a New Character</h1>
        <p>Add a fictional character to the gallery.</p>
    </header>

    <form>
        <div class="form-group">
            <label for="name">Character Name *</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter character name"
                required
            >
        </div>

        <div class="form-group">
            <label for="universe">Universe *</label>
            <input
                type="text"
                id="universe"
                name="universe"
                placeholder="Example: Marvel"
                required
            >
        </div>

        <div class="form-group">
            <label for="role">Role *</label>
            <input
                type="text"
                id="role"
                name="role"
                placeholder="Example: Hero"
                required
            >
        </div>

        <div class="form-group">
            <label for="image">Image URL *</label>
            <input
                type="url"
                id="image"
                name="image"
                placeholder="https://example.com/image.jpg"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Description *</label>
            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Enter a short description..."
                required
            ></textarea>
        </div>

        <button type="submit">Add Character</button>
    </form>

</body>
</html>
